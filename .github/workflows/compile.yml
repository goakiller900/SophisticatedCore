name: Compile JARs

on:
  workflow_dispatch:
  push:
    branches:
      - 1.21.x-fabric
  pull_request:
    branches:
      - 1.21.x-fabric

permissions:
  contents: read
  packages: read

jobs:
  compile:
    name: Compile SophisticatedCore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JARs
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          READ_PACKAGES_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
        run: ./gradlew clean build --stacktrace

      - name: List generated JARs
        if: success()
        run: ls -lah build/libs/*.jar

      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SophisticatedCore-${{ github.ref_name }}-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
