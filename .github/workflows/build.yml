name: Build JARs

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build SophisticatedCore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JARs
        env:
          USERNAME: ${{ github.actor }}
          READ_PACKAGES_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
        run: ./gradlew clean build --stacktrace

      - name: List generated JARs
        if: success()
        run: ls -lah build/libs/*.jar

      - name: Read project version
        if: success()
        id: version
        shell: bash
        run: |
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          ROLLING_TAG="latest-${MINECRAFT_VERSION}"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rolling_tag=${ROLLING_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SophisticatedCore-${{ steps.version.outputs.minecraft_version }}-${{ steps.version.outputs.mod_version }}-build.${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # Keep one rolling release per Minecraft version. Every successful push to
      # the main development branch replaces the previous release and all of its
      # attached JARs. Manual workflow runs do the same.
      - name: Replace rolling GitHub Release with latest JARs
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/1.21.x-fabric') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_TAG: ${{ steps.version.outputs.rolling_tag }}
          MINECRAFT_VERSION: ${{ steps.version.outputs.minecraft_version }}
          MOD_VERSION: ${{ steps.version.outputs.mod_version }}
        shell: bash
        run: |
          # Remove the old rolling release and its tag so the new tag always
          # points at the exact commit that produced these JARs.
          gh release delete "$ROLLING_TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$ROLLING_TAG" build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "SophisticatedCore ${MINECRAFT_VERSION} - Latest Build" \
            --notes "Automated rolling build of SophisticatedCore ${MINECRAFT_VERSION}-${MOD_VERSION}. Actions build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}. This release is replaced after every successful build of 1.21.x-fabric."
