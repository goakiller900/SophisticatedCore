name: Build JARs

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build SophisticatedCore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JARs
        env:
          USERNAME: ${{ github.actor }}
          READ_PACKAGES_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
        run: ./gradlew clean build --stacktrace

      - name: List generated JARs
        if: success()
        run: ls -lah build/libs/*.jar

      - name: Read project version
        if: success()
        id: version
        shell: bash
        run: |
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          RELEASE_TAG="v${MINECRAFT_VERSION}-${MOD_VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SophisticatedCore-${{ steps.version.outputs.minecraft_version }}-${{ steps.version.outputs.mod_version }}-build.${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # Pushes and pull requests only build and upload artifacts. A manual
      # "Run workflow" also creates a tagged GitHub Release with the JARs.
      - name: Create tagged GitHub Release and attach JARs
        if: github.event_name == 'workflow_dispatch' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          MINECRAFT_VERSION: ${{ steps.version.outputs.minecraft_version }}
          MOD_VERSION: ${{ steps.version.outputs.mod_version }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "SophisticatedCore ${MINECRAFT_VERSION}-${MOD_VERSION} (Build ${GITHUB_RUN_NUMBER})" \
            --generate-notes
